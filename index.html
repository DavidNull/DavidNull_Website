<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Cela Pedraza - Platform Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="ds.css/dist/ds.css">
    <link rel="stylesheet" href="public/assets/styles/main.css">
    <link rel="stylesheet" href="public/assets/styles/custom.css">
    <script src="public/assets/widgets/ds-clock.js"></script>
    <script src="public/assets/widgets/ds-calendar.js"></script>
    <script src="public/assets/js/main.js"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-2 md:p-4" id="main-body">
    <!-- DS Console Container -->
    <div id="ds-console" class="w-full max-w-3xl rounded-3xl shadow-2xl overflow-hidden flex flex-col" style="background-color: var(--ds-primary); background-image: url(''); background-size: cover; background-position: center; max-height: 90vh;">
        <!-- Top Screen -->
        <div class="h-[35vh] p-4 relative flex-shrink-0" style="background-color: var(--ds-secondary);">
            <div id="top-screen-bg" class="ds-screen h-full rounded-xl p-3 overflow-y-auto scanlines relative border-4" 
                 style="background: linear-gradient(135deg, var(--ds-screen) 0%, var(--ds-screen-light) 100%); border-color: var(--ds-primary); box-shadow: inset 0 4px 8px rgba(0,0,0,0.3), 0 2px 4px rgba(255,255,255,0.1);">
                <!-- Splash State -->
                <div id="splash-content" class="h-full flex flex-col items-center justify-center text-ds-black">
                    <h1 class="ds-font text-lg md:text-2xl text-center mb-4 game-text">David Cela Pedraza</h1>
                    <p class="ds-font text-xs md:text-sm text-center mb-8 game-text">Platform Engineer</p>
                    
                    <div class="flex gap-4 mb-8">
                        <button id="lang-es" class="ds-font text-sm md:text-base px-6 py-3 rounded border-2 transition-all hover:scale-110 active:scale-125" style="color: #ffffff; border-color: #000000; background-color: #ff0000; min-width: 120px; min-height: 60px;">
                            <span class="font-bold">ES</span>
                        </button>
                        <button id="lang-en" class="ds-font text-sm md:text-base px-6 py-3 rounded border-2 transition-all hover:scale-110 active:scale-125" style="color: #ffffff; border-color: #000000; background-color: #0000ff; min-width: 120px; min-height: 60px;">
                            <span class="font-bold">EN</span>
                        </button>
                    </div>
                    
                    <button id="start-btn" class="ds-font text-xs md:text-sm p-2 rounded hover:scale-105 transition-all duration-200 animate-blink border-2 game-text flex items-center justify-center" 
                            style="background-color: var(--ds-primary); min-height: 70px; min-width: 200px; color: #ffffff; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);">
                        <span class="relative z-10 text-center">START / TOUCH TO START</span>
                    </button>
                </div>
                
                <!-- Main Content (Hidden initially) -->
                <div id="main-content" class="hidden h-full">
                    <div id="content-area" class="text-ds-black">
                        <!-- Content will be injected here -->
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Hinge -->
        <div class="h-6 relative" style="background-color: var(--ds-primary);">
            <div class="absolute inset-0 flex justify-center items-center gap-2">
                <div class="w-2 h-2 rounded-full" style="background-color: var(--ds-secondary);"></div>
                <div class="w-2 h-2 rounded-full" style="background-color: var(--ds-secondary);"></div>
            </div>
        </div>
        
        <!-- Bottom Screen -->
        <div class="h-[45vh] p-4 relative flex-grow" style="background-color: var(--ds-secondary);">
            <div id="bottom-screen-bg" class="ds-grid h-full rounded-xl p-3 relative scanlines border-4" 
                 style="background: linear-gradient(135deg, var(--ds-screen) 0%, var(--ds-screen-light) 100%); border-color: var(--ds-primary); box-shadow: inset 0 4px 8px rgba(0,0,0,0.3), 0 2px 4px rgba(255,255,255,0.1);">
                <!-- Loading State (Initial) -->
                <div id="loading-state" class="h-full flex flex-col items-center justify-center">
                    <div class="alert">
                        <div class="loading-container">
                            <div class="loading-1"></div>
                            <div class="loading-2"></div>
                            <div class="loading-3"></div>
                            <div class="loading-4"></div>
                            <div class="loading-5"></div>
                            <div class="loading-6"></div>
                            <div class="loading-7"></div>
                            <div class="loading-8"></div>
                            <div class="loading-9"></div>
                        </div>
                        <span>Loading...</span>
                        <div class="loading-container">
                            <div class="loading-1"></div>
                            <div class="loading-2"></div>
                            <div class="loading-3"></div>
                            <div class="loading-4"></div>
                            <div class="loading-5"></div>
                            <div class="loading-6"></div>
                            <div class="loading-7"></div>
                            <div class="loading-8"></div>
                            <div class="loading-9"></div>
                        </div>
                    </div>
                </div>
                
                <!-- Cartridge Grid (Hidden initially) -->
                <div id="cartridge-grid" class="hidden h-full flex items-center justify-center">
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 w-full pb-12">
                        <!-- CV Cartridge -->
                        <button class="cartridge-btn button-lg ds-font text-xs transition-all duration-200 relative overflow-hidden flex items-center justify-center" data-section="cv" 
                                style="color: #ffffff;">
                            <span class="relative z-10 text-center text-shadow">CV</span>
                        </button>
                        
                        <!-- Skills Cartridge -->
                        <button class="cartridge-btn button-lg ds-font text-xs transition-all duration-200 relative overflow-hidden flex items-center justify-center" data-section="skills" 
                                style="color: #ffffff;">
                            <span class="relative z-10 text-center text-shadow">SKILLS</span>
                        </button>
                        
                        <!-- Experience Cartridge -->
                        <button class="cartridge-btn button-lg ds-font text-xs transition-all duration-200 relative overflow-hidden flex items-center justify-center" data-section="experience" 
                                style="color: #ffffff;">
                            <span class="relative z-10 text-center text-shadow">EXP</span>
                        </button>
                        
                        <!-- Certs Cartridge -->
                        <button class="cartridge-btn button-lg ds-font text-xs transition-all duration-200 relative overflow-hidden flex items-center justify-center" data-section="certs" 
                                style="color: #ffffff;">
                            <span class="relative z-10 text-center text-shadow">CERTS</span>
                        </button>
                        
                        <!-- Projects Cartridge -->
                        <button class="cartridge-btn button-lg ds-font text-xs transition-all duration-200 relative overflow-hidden flex items-center justify-center" data-section="projects" 
                                style="color: #ffffff;">
                            <span class="relative z-10 text-center text-shadow">PROJ</span>
                        </button>
                        
                        <!-- Education Cartridge -->
                        <button class="cartridge-btn button-lg ds-font text-xs transition-all duration-200 relative overflow-hidden flex items-center justify-center" data-section="education" 
                                style="color: #ffffff;">
                            <span class="relative z-10 text-center text-shadow">EDU</span>
                        </button>
                        
                        <!-- Contact Cartridge -->
                        <button class="cartridge-btn button-lg ds-font text-xs transition-all duration-200 relative overflow-hidden flex items-center justify-center" data-section="contact" 
                                style="color: #ffffff;">
                            <span class="relative z-10 text-center text-shadow">CONTACT</span>
                        </button>
                    </div>
                </div>
                
                <!-- HUD -->
                <div id="hud" class="hidden absolute bottom-0 left-0 right-0 p-3 flex justify-between items-center border-t-4 rounded-b-lg" 
                     style="background-color: var(--ds-primary)95; border-color: var(--ds-primary); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);">
                    <div class="flex items-center gap-3">
                        <span id="time" class="ds-clock-font text-xs" style="color: var(--ds-screen);">00:00</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <!-- Power Button -->
                        <button id="power-btn" class="w-8 h-8 bg-green-500 rounded flex items-center justify-center hover:bg-green-600 transition-colors border-2" 
                                style="border-color: var(--ds-screen);" title="POWER OFF">
                            <span class="ds-font text-xs" style="color: #ffffff;">⏻</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- External Widgets for PC -->
    <div class="mt-8 flex flex-col items-center gap-4">
        <div class="ds-grid" style="width: fit-content">
            <ds-clock style="--color: var(--color-ds-slate)" hide-border></ds-clock>
        </div>
        <ds-calendar style="--color: var(--color-ds-slate)" hide-border></ds-calendar>
    </div>

    <!-- Console Color Selector (PC only) -->
    <div id="color-selector" class="color-selector">
        <div class="color-dropdown" id="color-dropdown">
            <div class="color-dropdown-header" onclick="toggleColorDropdown()">
                <h3>Console Color</h3>
                <span class="color-dropdown-arrow">▼</span>
            </div>
            <div class="color-options">
                <button class="color-btn" style="background-color: #494949;" data-color="black" data-image="public/assets/ds-consoles/ds/Black_DS.png"></button>
                <button class="color-btn" style="background-color: #61829a;" data-color="slate" data-image="public/assets/ds-consoles/ds/Blue-Royal_DS.png"></button>
                <button class="color-btn" style="background-color: #ba4900;" data-color="maroon" data-image="public/assets/ds-consoles/ds/Red-Candy_DS.png"></button>
                <button class="color-btn" style="background-color: #fb8afb;" data-color="pink" data-image="public/assets/ds-consoles/ds/Pink-light_DS.png"></button>
                <button class="color-btn" style="background-color: #00fb00;" data-color="lime" data-image="public/assets/ds-consoles/ds/Green-lime_DS.png"></button>
                <button class="color-btn" style="background-color: #30baf3;" data-color="turquoise" data-image="public/assets/ds-consoles/ds/Blue-light_DS.png"></button>
            </div>
        </div>
    </div>
</body>
</html>
